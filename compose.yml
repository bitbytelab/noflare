version: '3.8'

services:
	noflare:
		build: .
		image: noflare:latest
		restart: unless-stopped
		ports:
			- "8191:8191"
		env_file:
			- .env
		volumes:
			- ./data:/data/noflare
		healthcheck:
			test: ["CMD-SHELL", "curl -f http://localhost:8191/ || exit 1"]
			interval: 30s
			timeout: 10s
			retries: 3
